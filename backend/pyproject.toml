[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-yay-brainchain-backend"
version = "0.1.0"
description = "Backend starter for the E-yAy BrainChain system."
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    # Database
    "alembic",
    "sqlalchemy",
    "psycopg[binary]",
    "redis",
    # Market data
    "yfinance>=1.4.0",
    "pandas",
    # News / RSS
    "feedparser",
    # AI analyst
    "anthropic>=0.105",
    "pyyaml>=6.0",
    # Utilities
    "httpx",
    "structlog",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",            # backend/
    "..",           # repo root (registry modülü için)
]
