[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-yay-brainchain-backend"
version = "0.1.0"
description = "Backend starter for the E-yAy BrainChain system."
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    # Database
    "alembic",
    "sqlalchemy",
    "psycopg[binary]",
    "redis",
    # Market data
    "yfinance>=1.4.0",
    "pandas",
    # News / RSS
    "feedparser",
    # AI analyst
    "anthropic>=0.105",
    "pyyaml>=6.0",
    # Utilities
    "httpx",
    "structlog",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",            # backend/
    "..",           # repo root (registry modülü için)
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Aktif kurallar — F (pyflakes), E (pycodestyle errors), W (warnings)
select = ["F", "E", "W"]
# Stil hataları (runtime'a etkisi yok): tek satır multi-statement, top-of-file
# import, lambda/I/l/O parametre adları, satır uzunluğu. CI'yı bloklamasınlar.
ignore = ["E402", "E701", "E702", "E741", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
